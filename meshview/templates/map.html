{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
<style>
    .legend { background:white;padding:8px;line-height:1.5;border-radius:5px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-size:14px;color:black; }
    .legend i { width:12px;height:12px;display:inline-block;margin-right:6px;border-radius:50%; }

    #filter-container { text-align:center;margin-top:10px; }
    .filter-checkbox { margin:0 10px; }

    #share-button,
    #reset-filters-button {
        padding:5px 15px;border:none;border-radius:4px;font-size:14px;cursor:pointer;color:white;
    }
    #share-button { margin-left:20px; background-color:#4CAF50; }
    #share-button:hover { background-color:#45a049; }
    #share-button:active { background-color:#3d8b40; }

    #reset-filters-button { margin-left:10px; background-color:#f44336; }
    #reset-filters-button:hover { background-color:#da190b; }
    #reset-filters-button:active { background-color:#c41e0d; }

    .blinking-tooltip {
        background: white;
        color: black;
        border: 1px solid #111;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 14px;
        font-weight: 400;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .blinking-tooltip.text-packet {
        animation: textPulse 1.1s ease-in-out 6;
        border-color: #ff8c00;
    }
    .packet-seen-trace {
        stroke-dasharray: 5px var(--packet-trace-gap, 999px);
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.65));
        animation: packetTrace var(--packet-trace-duration, 6.5s) linear 1 forwards;
    }
    .packet-seen-landing {
        transform-box: fill-box;
        transform-origin: center;
        animation: packetSeenLanding 1s ease-out 1 forwards;
    }
    @keyframes packetTrace {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: calc(-1 * var(--packet-trace-distance, 1000px)); }
    }
    @keyframes packetSeenLanding {
        from {
            stroke-opacity: 0.95;
            fill-opacity: 0.35;
            transform: scale(0.2);
        }
        to {
            stroke-opacity: 0;
            fill-opacity: 0;
            transform: scale(1.8);
        }
    }
    @keyframes textPulse {
        0% { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
        50% { box-shadow: 0 4px 14px rgba(255,140,0,0.45); }
        100% { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    }

    #map-wrapper {
        position: relative;
        width: 100%;
        height: calc(100vh - 270px);
    }
    #map {
        width: 100%;
        height: 100%;
    }
    #unmapped-packets {
        position: absolute;
        bottom: 30px;
        right: 15px;
        z-index: 600;
        width: 220px;
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 12px;
        text-align: left;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        pointer-events: auto;
    }
    #unmapped-packets h3 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: #000;
    }
    #unmapped-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 120px;
        overflow-y: auto;
    }
    #unmapped-list li {
        display: flex;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px dotted #e0e0e0;
    }
    #unmapped-list li:last-child { border-bottom: none; }
    .unmapped-node { font-weight: 400; color: #000; }
    .unmapped-empty { color: #666; font-style: italic; }
</style>
{% endblock %}

{% block body %}

<div id="map-wrapper">
    <div id="map"></div>

    <div id="unmapped-packets">
        <h3 data-translate-lang="unmapped_packets_title">Unmapped Packets</h3>  
        <ul id="unmapped-list">
            <li class="unmapped-empty" data-translate-lang="unmapped_packets_empty">
                No recent unmapped packets.
            </li>
        </ul>
    </div>
</div>

<div id="map-legend"
     class="legend"
     style="position:absolute;
            bottom:30px;
            right:15px;
            z-index:500;
            pointer-events:none;">
    <div>
        <i style="background:orange; width:15px; height:3px; border-radius:0;"></i>
        <span data-translate-lang="legend_traceroute">Traceroute Path (arrowed)</span>
    </div>

    <div style="margin-top:6px;">
        <i style="background:gray; width:15px; height:3px; border-radius:0;"></i>
        <span data-translate-lang="legend_neighbor">Neighbor Link</span>
    </div>
</div>

<div id="filter-container">
    <input type="checkbox" class="filter-checkbox" id="filter-routers-only">
    <span data-translate-lang="show_routers_only">Show Routers Only</span>
    <input type="checkbox" class="filter-checkbox" id="filter-mqtt-only">
    <span data-translate-lang="show_mqtt_only">Show MQTT Gateways Only</span>
</div>

<div style="text-align:center;margin-top:5px;">
    <button id="share-button" onclick="shareCurrentView()" data-translate-lang="share_view">
        🔗 Share This View
    </button>
    <button id="reset-filters-button" onclick="resetFiltersToDefaults()" data-translate-lang="reset_filters">
        ↺ Reset Filters To Defaults
    </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylinedecorator.js"
        integrity="sha384-FhPn/2P/fJGhQLeNWDn9B/2Gml2bPOrKJwFqJXgR3xOPYxWg5mYQ5XZdhUSugZT0"
        crossorigin></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="/static/portmaps.js"></script>

<script>
/* ======================================================
   MAP PAGE TRANSLATION SYSTEM
   ====================================================== */

let mapTranslations = {};

async function loadTranslationsMap() {
    try {
        const cfg = await window._siteConfigPromise;
        const lang = cfg?.site?.language || "en";
        const res  = await fetch(`/api/lang?lang=${lang}&section=map`);
        mapTranslations = await res.json();
        applyTranslationsMap();
    } catch (err) {
        console.error("Map translation load failed:", err);
    }
}

function applyTranslationsMap(root = document) {
    root.querySelectorAll("[data-translate-lang]").forEach(el => {
        const key = el.dataset.translateLang;
        const val = mapTranslations[key];
        if (!val) return;

        if (el.tagName === "INPUT" && el.placeholder !== undefined) {
            el.placeholder = val;
        } else {
            el.textContent = val;
        }
    });
}

/* ======================================================
   EXISTING MAP LOGIC
   ====================================================== */

var map = L.map('map');
var baseLayers = {
    "OpenStreetMap": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }),
    "OpenTopoMap": L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17,
        attribution: 'Map data: &copy; OpenStreetMap, SRTM | Map style: &copy; OpenTopoMap'
    })
};
baseLayers["OpenStreetMap"].addTo(map);
L.control.scale({
    position: 'bottomleft',
    metric: true,
    imperial: true
}).addTo(map);
var nodeLayer = L.layerGroup().addTo(map);
var edgeLayer = L.layerGroup().addTo(map);
var packetSeenLayer = L.layerGroup().addTo(map);
var trafficHeatLayer = L.heatLayer([], {
    radius: 34,
    blur: 18,
    maxZoom: 12,
    minOpacity: 0.3,
    gradient: {
        0.2: "#0b1f4d",
        0.45: "#12436b",
        0.7: "#7f2704",
        1.0: "#4d0000"
    }
});
var overlayLayers = {
    "Nodes": nodeLayer,
    "Packet Heard By": packetSeenLayer,
    "Traffic HeatMap": trafficHeatLayer
};
L.control.layers(baseLayers, overlayLayers, { collapsed: false }).addTo(map);

// Data structures
var nodes = [], markers = {}, markerById = {}, nodeMap = new Map();
var selectedNodeId = null;
var activeBlinks = new Map(), lastImportTime = null;
var activePacketSeenHighlights = [];
var mapInterval = 0;
var unmappedPackets = [];
var trafficHeatLoaded = false;
var trafficHeatLoading = false;
const UNMAPPED_LIMIT = 50;
const UNMAPPED_TTL_MS = 5000;
const PACKET_SEEN_DELAY_MS = 5000;
const PACKET_TRACE_MIN_DURATION_MS = 1500;
const PACKET_TRACE_MAX_DURATION_MS = 6500;
const PACKET_TRACE_MS_PER_PIXEL = 18;
const PACKET_LANDING_DURATION_MS = 1000;

const portMap = window.PORT_LABEL_MAP;

// Fallback colors for channels that are not Meshtastic presets.
// Every entry clears 3:1 contrast against both the light map tiles and the dark
// filter panel, and stays perceptually far from every channelColorOverrides value.
const palette = ["#18aa18","#976049","#a5508c","#1898dc","#3a8846","#dc1884",
                 "#b8813d","#b64f35","#408b18","#4c719e","#be379c","#18aa52"];

const channelColorOverrides = {
    longfast: "#4363d8",
    longslow: "#000075",
    verylongslow: "#808000",
    mediumslow: "#008080",
    mediumfast: "#e6194b",
    shortslow: "#911eb4",
    shortfast: "#f58231",
    longmoderate: "#46f0f0",
    shortturbo: "#f032e6"
};

const colorMap = new Map();
const channelSet = new Set();

map.on("popupopen", function (e) {
    const popupEl = e.popup.getElement();
    if (popupEl) applyTranslationsMap(popupEl);
});

function timeAgoFromUs(us){
    const diff = Date.now() - (us / 1000);
    const s = Math.floor(diff/1000), m = Math.floor(s/60),
          h = Math.floor(m/60),       d = Math.floor(h/24);
    return d>0?d+"d":h>0?h+"h":m>0?m+"m":s+"s";
}

function normalizeChannelName(str){
    return String(str || "Unknown").toLowerCase().replace(/[\s_-]+/g, "");
}

function hashToColor(str){
    const channel = String(str || "Unknown");
    if(colorMap.has(channel)) return colorMap.get(channel);

    const override = channelColorOverrides[normalizeChannelName(channel)];
    const c = override || palette[Math.floor(hashToUnit(channel) * palette.length) % palette.length];
    colorMap.set(channel,c);
    return c;
}

function labelFor(key, fallback){
    return mapTranslations[key] || fallback;
}

function buildNodePopup(node){
    const labels = {
        channel: labelFor("channel_label", "Channel"),
        nodeId: labelFor("node_id", "Node ID"),
        model: labelFor("model_label", "Model"),
        role: labelFor("role_label", "Role"),
        mqtt: labelFor("mqtt_gateway", "MQTT Gateway"),
        lastSeen: labelFor("last_seen", "Last Seen"),
        firmware: labelFor("firmware", "Firmware"),
        yes: mapTranslations.yes || "Yes",
        no: mapTranslations.no || "No"
    };
    const displayName = node.long_name || node.short_name || `Node ${node.node_id}`;
    const shortName = node.short_name ? ` (${escapeHtml(node.short_name)})` : "";

    return `
        <b><a href="/node/${node.node_id}">${escapeHtml(displayName)}</a>${shortName}</b><br>

        <b>${labels.nodeId}</b> ${node.node_id}<br>
        <b>${labels.channel}</b> ${escapeHtml(node.channel || "N/A")}<br>
        <b>${labels.model}</b> ${escapeHtml(node.hw_model || "N/A")}<br>
        <b>${labels.role}</b> ${escapeHtml(node.role || "N/A")}<br>
        <b>${labels.mqtt}</b> ${node.is_mqtt_gateway ? labels.yes : labels.no}<br>

        ${
            node.last_seen_us
                ? `<b>${labels.lastSeen}</b> ${timeAgoFromUs(node.last_seen_us)}<br>`
                : ""
        }

        ${
            node.firmware
                ? `<b>${labels.firmware}</b> ${escapeHtml(node.firmware)}<br>`
                : ""
        }
    `;
}

function hashToUnit(str){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 0xffffffff;
}

function jitterLatLng(lat, lon, key){
    const meters = 15; // small, visually separates overlaps
    const angle = hashToUnit(String(key)) * Math.PI * 2;
    const r = meters * (0.3 + 0.7 * hashToUnit(`r:${key}`));
    const dLat = (r * Math.cos(angle)) / 111320;
    const dLon = (r * Math.sin(angle)) / (111320 * Math.cos(lat * Math.PI / 180));
    return [lat + dLat, lon + dLon];
}

function isInvalidCoord(n){
    return !n || !n.lat || !n.long || n.lat === 0 || n.long === 0 ||
           Number.isNaN(n.lat) || Number.isNaN(n.long);
}

function getNodeLatLng(n){
    const marker = markerById[n.key];
    if(marker){
        return marker.getLatLng();
    }
    return { lat: n.lat, lng: n.long };
}

/* ======================================================
   PACKET FETCHING (unchanged)
   ====================================================== */

function fetchLatestPacket(){
    fetch(`/api/packets?limit=1`)
      .then(r=>r.json())
      .then(data=>{
          lastImportTime=data.packets?.[0]?.import_time_us||0;
      })
      .catch(console.error);
}

function fetchNewPackets(){
    if(mapInterval <= 0) return;
    if(lastImportTime===null) return;

    const url = new URL(`/api/packets`, window.location.origin);
    url.searchParams.set("since", lastImportTime);
    url.searchParams.set("limit", 50);

    fetch(url)
      .then(r=>r.json())
      .then(data=>{
          if(!data.packets || data.packets.length===0) return;
          let latest = lastImportTime;

          data.packets.forEach(pkt=>{
              if(pkt.import_time_us > latest) latest = pkt.import_time_us;

              const marker = markerById[pkt.from_node_id];
              const nodeData = nodeMap.get(pkt.from_node_id);
              if(marker && nodeData) {
                  blinkNode(marker, nodeData.long_name, pkt.portnum, pkt.payload);
              } else {
                  addUnmappedPacket(pkt, nodeData);
              }
              schedulePacketSeenNodes(pkt);
          });

          lastImportTime = latest;
      })
      .catch(console.error);
}

let packetInterval=null;

function startPacketFetcher(){
    if(mapInterval<=0) return;
    if(!packetInterval){
        fetchLatestPacket();
        packetInterval=setInterval(fetchNewPackets,mapInterval*1000);
    }
}

function stopPacketFetcher(){
    if(packetInterval){
        clearInterval(packetInterval);
        packetInterval=null;
    }
}

document.addEventListener("visibilitychange",()=>{
    document.hidden?stopPacketFetcher():startPacketFetcher();
});

map.on("overlayadd", e => {
    if(e.layer === nodeLayer) updateNodeVisibility();
    if(e.layer === trafficHeatLayer) loadTrafficHeat();
});

map.on("overlayremove", e => {
    if(e.layer === nodeLayer) clearActiveBlinks();
    if(e.layer === packetSeenLayer) clearPacketSeenHighlights();
});

async function waitForConfig() {
    while (typeof window._siteConfigPromise === "undefined") {
        await new Promise(r => setTimeout(r, 100));
    }
    try {
        const cfg = await window._siteConfigPromise;
        return cfg.site || {};
    } catch (err) {
        console.error("Error loading site config:", err);
        return {};
    }
}

async function initMapPolling() {
    try {
        const site = await waitForConfig();
        mapInterval = parseInt(site.map_interval, 10) || 0;

        const params = new URLSearchParams(window.location.search);
        const lat  = parseFloat(params.get('lat'));
        const lng  = parseFloat(params.get('lng'));
        const zoom = parseInt(params.get('zoom'), 10);

        if (!isNaN(lat) && !isNaN(lng) && !isNaN(zoom)) {
            map.setView([lat, lng], zoom);
            window.configBoundsApplied = true;
            setTimeout(() => map.invalidateSize(), 100);
        }
        else {
            const tl = [parseFloat(site.map_top_left_lat), parseFloat(site.map_top_left_lon)];
            const br = [parseFloat(site.map_bottom_right_lat), parseFloat(site.map_bottom_right_lon)];

            if (tl.every(isFinite) && br.every(isFinite)) {
                map.fitBounds([tl, br]);
                window.configBoundsApplied = true;
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        if (mapInterval > 0) startPacketFetcher();

    } catch (err) {
        console.error("Failed to load /api/config:", err);
    }
}

initMapPolling();

/* ======================================================
   LOAD NODES
   ====================================================== */

fetch('/api/nodes?days_active=3')
    .then(r=>r.json())
    .then(data=>{
        if(!data.nodes) return;

        nodes = data.nodes.map(n=>({
            key: n.node_id ?? n.id,
            id: n.id,
            node_id: n.node_id,
            lat: n.last_lat ? n.last_lat/1e7 : null,
            long: n.last_long ? n.last_long/1e7 : null,
            long_name: n.long_name || "",
            short_name: n.short_name || "",
            channel: n.channel || "",
            hw_model: n.hw_model || "",
            role: n.role || "",
            firmware: n.firmware || "",
            last_seen_us: n.last_seen_us || null,
            is_mqtt_gateway: n.is_mqtt_gateway === true,
            isRouter: (n.role||"").toLowerCase().includes("router")
        }));

        nodes.forEach(n=>{
            nodeMap.set(n.key, n);
            if(n.channel) channelSet.add(n.channel);
        });

        renderNodesOnMap();
        createChannelFilters();
        if(map.hasLayer(trafficHeatLayer)){
            loadTrafficHeat();
        }
    })
    .catch(console.error);

/* ======================================================
   RENDER NODES
   ====================================================== */

function renderNodesOnMap(){
    nodes.forEach(node=>{
        if(isInvalidCoord(node)) return;

        const color = hashToColor(node.channel);

        const [jLat, jLon] = jitterLatLng(node.lat, node.long, node.key);
        const marker = L.circleMarker([jLat,jLon], {
            radius: node.isRouter ? 9 : 7,
            color: "white",
            fillColor: color,
            fillOpacity: 1,
            weight: 0.7
        }).addTo(nodeLayer);

        marker.nodeId = node.key;
        marker.originalColor = color;
        markerById[node.key] = marker;
        marker.bindPopup(buildNodePopup(node), {
            autoPan: true,
            closeButton: true
        });

        marker.on('click', e => {
            if(e.originalEvent){
                L.DomEvent.stopPropagation(e.originalEvent);
            }
            marker.setPopupContent(buildNodePopup(node));
            marker.openPopup();
            onNodeClick(node);
        });
    });

    setTimeout(() => applyTranslationsMap(), 50);
}

/* ======================================================
   TRAFFIC HEAT LAYER
   ====================================================== */

async function loadTrafficHeat(){
    if(trafficHeatLoaded || trafficHeatLoading) return;
    if(nodeMap.size === 0) return;

    trafficHeatLoading = true;

    try {
        const url = new URL("/api/packets", window.location.origin);
        url.searchParams.set("limit", 1000);

        const res = await fetch(url);
        if(!res.ok) return;

        const data = await res.json();
        const counts = new Map();

        (data.packets || []).forEach(pkt => {
            const nodeId = pkt.from_node_id;
            if(nodeId == null) return;
            counts.set(nodeId, (counts.get(nodeId) || 0) + 1);
        });

        const maxCount = Math.max(...counts.values(), 0);
        const heatPoints = [];

        counts.forEach((count, nodeId) => {
            const node = nodeMap.get(nodeId);
            if(!node || isInvalidCoord(node)) return;

            const markerLatLng = markerById[nodeId]?.getLatLng();
            const lat = markerLatLng?.lat ?? node.lat;
            const lng = markerLatLng?.lng ?? node.long;
            const intensity = maxCount > 0 ? count / maxCount : 0;

            heatPoints.push([lat, lng, Math.max(0.15, intensity)]);
        });

        trafficHeatLayer.setLatLngs(heatPoints);
        trafficHeatLoaded = true;
    } catch(err) {
        console.error("Failed to load traffic heat layer:", err);
    } finally {
        trafficHeatLoading = false;
    }
}

/* ======================================================
   UNMAPPED PACKETS LIST
   ====================================================== */

function addUnmappedPacket(pkt, nodeData){
    if(nodeData && !isInvalidCoord(nodeData)) return;

    const now = Date.now();
    const entry = {
        id: pkt.id,
        key: `${pkt.id ?? "x"}-${pkt.import_time_us ?? now}-${Math.random().toString(16).slice(2)}`,
        import_time_us: pkt.import_time_us || 0,
        from_node_id: pkt.from_node_id,
        long_name: pkt.long_name || (nodeData?.long_name || ""),
        portnum: pkt.portnum,
        payload: (pkt.payload || "").trim(),
        expires_at: now + UNMAPPED_TTL_MS
    };

    unmappedPackets.unshift(entry);
    pruneUnmappedPackets(now);
    if(unmappedPackets.length > UNMAPPED_LIMIT){
        unmappedPackets = unmappedPackets.slice(0, UNMAPPED_LIMIT);
    }
    renderUnmappedPackets();

    setTimeout(() => {
        pruneUnmappedPackets(Date.now());
        renderUnmappedPackets();
    }, UNMAPPED_TTL_MS + 50);
}

function pruneUnmappedPackets(now){
    unmappedPackets = unmappedPackets.filter(p => p.expires_at > now);
}

function renderUnmappedPackets(){
    pruneUnmappedPackets(Date.now());
    const list = document.getElementById("unmapped-list");
    list.innerHTML = "";

    if(unmappedPackets.length === 0){
        const empty = document.createElement("li");
        empty.className = "unmapped-empty";
        empty.dataset.translateLang = "unmapped_packets_empty";
        empty.textContent = "No recent unmapped packets.";
        list.appendChild(empty);
        return;
    }

    unmappedPackets.forEach(p=>{
        const li = document.createElement("li");

        const node = document.createElement("span");
        node.className = "unmapped-node";
        const type = portMap[p.portnum] || `Port ${p.portnum ?? "?"}`;
        const name = p.long_name || `Node ${p.from_node_id ?? "?"}`;
        node.textContent = `${name} (${type})`;

        li.appendChild(node);
        list.appendChild(li);
    });
}

/* ======================================================
   ⭐ NEW: DYNAMIC EDGE LOADING
   ====================================================== */

async function onNodeClick(node){
    selectedNodeId = node.key;
    edgeLayer.clearLayers();

    try {
        const res = await fetch(`/api/edges?node_id=${node.key}`);
        const data = await res.json();
        const edges = data.edges || [];

        edges.forEach(edge=>{
            const f = nodeMap.get(edge.from);
            const t = nodeMap.get(edge.to);

            if(!f || !t || isInvalidCoord(f) || isInvalidCoord(t)) return;

            const color = edge.type === "neighbor" ? "gray" : "orange";
            const fLatLng = getNodeLatLng(f);
            const tLatLng = getNodeLatLng(t);
            const line  = L.polyline([[fLatLng.lat, fLatLng.lng], [tLatLng.lat, tLatLng.lng]], {
                color, weight: 3
            }).addTo(edgeLayer);

            if(edge.type === "traceroute"){
                L.polylineDecorator(line, {
                    patterns: [
                        {
                            offset: '100%',
                            repeat: 0,
                            symbol: L.Symbol.arrowHead({
                                pixelSize:5,
                                polygon:false,
                                pathOptions:{stroke:true,color}
                            })
                        }
                    ]
                }).addTo(edgeLayer);
            }
        });

    } catch(err){
        console.error("Failed to load edges for node", node.key, err);
    }
}

map.on('click', e=>{
    if(e.originalEvent.defaultPrevented) return;

    if(!e.originalEvent.target.classList.contains('leaflet-interactive')){
        edgeLayer.clearLayers();
        selectedNodeId=null;
    }
});

/* ======================================================
   BLINKING
   ====================================================== */

function escapeHtml(value){
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function isTextPort(portnum){
    return portnum === 1 || portnum === 7;
}

function isNodeVisibleForPackets(marker){
    return map.hasLayer(nodeLayer) && nodeLayer.hasLayer(marker);
}

function clearBlinkForMarker(marker){
    if(activeBlinks.has(marker)){
        const interval = activeBlinks.get(marker);
        clearInterval(interval);
        activeBlinks.delete(marker);
    }
    marker.setStyle({ fillColor: marker.originalColor });
    if(marker.tooltip){
        map.removeLayer(marker.tooltip);
        marker.tooltip = null;
    }
}

function clearActiveBlinks(){
    activeBlinks.forEach((interval, marker) => clearBlinkForMarker(marker));
    activeBlinks.clear();
}

function clearPacketSeenHighlights(){
    activePacketSeenHighlights.forEach(timeout => clearTimeout(timeout));
    activePacketSeenHighlights = [];
    packetSeenLayer.clearLayers();
}

function schedulePacketSeenNodes(pkt){
    if(!map.hasLayer(packetSeenLayer) || pkt.id == null) return;

    const timeout = setTimeout(() => showPacketSeenNodes(pkt), PACKET_SEEN_DELAY_MS);
    activePacketSeenHighlights.push(timeout);
}

async function showPacketSeenNodes(pkt){
    if(!map.hasLayer(packetSeenLayer) || pkt.id == null) return;

    try {
        const res = await fetch(`/api/packets_seen/${pkt.id}`);
        if(!res.ok) return;

        const data = await res.json();
        const seen = data.seen || [];
        const sourceId = pkt.from_node_id;
        const sourceNode = nodeMap.get(sourceId);
        const sourceLatLng = sourceNode && !isInvalidCoord(sourceNode)
            ? getNodeLatLng(sourceNode)
            : null;

        seen.forEach(row => {
            const node = nodeMap.get(row.node_id);
            if(!node || isInvalidCoord(node)) return;

            const isSource = row.node_id === sourceId;
            if(!sourceLatLng || isSource) return;

            const markerLatLng = markerById[row.node_id]?.getLatLng();
            const lat = markerLatLng?.lat ?? node.lat;
            const lng = markerLatLng?.lng ?? node.long;
            const trace = L.polyline([[sourceLatLng.lat, sourceLatLng.lng], [lat, lng]], {
                color: "#000",
                weight: 6,
                opacity: 0.9,
                className: "packet-seen-trace",
                interactive: false
            }).addTo(packetSeenLayer);
            const traceEl = trace.getElement();
            let traceDurationMs = PACKET_TRACE_MAX_DURATION_MS;
            if(traceEl){
                const traceLength = traceEl.getTotalLength();
                traceDurationMs = Math.min(
                    PACKET_TRACE_MAX_DURATION_MS,
                    Math.max(PACKET_TRACE_MIN_DURATION_MS, traceLength * PACKET_TRACE_MS_PER_PIXEL)
                );
                traceEl.style.setProperty("--packet-trace-gap", `${traceLength + 20}px`);
                traceEl.style.setProperty("--packet-trace-distance", `${traceLength + 20}px`);
                traceEl.style.setProperty("--packet-trace-duration", `${traceDurationMs}ms`);
            }

            const landingTimeout = setTimeout(() => {
                const landing = L.circleMarker([lat, lng], {
                    radius: 14,
                    color: "#000",
                    fillColor: "#000",
                    fillOpacity: 0.35,
                    opacity: 0.95,
                    weight: 2,
                    className: "packet-seen-landing",
                    interactive: false
                }).addTo(packetSeenLayer);

                const clearLandingTimeout = setTimeout(() => {
                    packetSeenLayer.removeLayer(landing);
                }, PACKET_LANDING_DURATION_MS);
                activePacketSeenHighlights.push(clearLandingTimeout);
            }, traceDurationMs);
            activePacketSeenHighlights.push(landingTimeout);

            const timeout = setTimeout(() => {
                packetSeenLayer.removeLayer(trace);
            }, traceDurationMs + PACKET_LANDING_DURATION_MS);
            activePacketSeenHighlights.push(timeout);
        });
    } catch(err) {
        console.error("Failed to load packet seen nodes", pkt.id, err);
    }
}

function blinkNode(marker,longName,portnum,payload){
    if(!isNodeVisibleForPackets(marker)) return;

    if(activeBlinks.has(marker)){
        clearBlinkForMarker(marker);
    }

    let blinkCount = 0;
    const blinkStart = Date.now();
    const blinkDurationMs = 7000;
    const safeName = escapeHtml(longName);
    const portLabel = portMap[portnum] || `Port ${portnum ?? "?"}`;
    const payloadText = (payload || "").trim();
    const showPayload = isTextPort(portnum) && payloadText && payloadText !== "Did not decode";
    const shortPayload = showPayload && payloadText.length > 80
        ? `${payloadText.slice(0, 77)}...`
        : payloadText;
    const payloadLine = showPayload ? `<br><span>${escapeHtml(shortPayload)}</span>` : "";

    const tooltip = L.tooltip({
        permanent:true,
        direction:'top',
        offset:[0,-marker.options.radius-5],
        className: isTextPort(portnum) ? 'blinking-tooltip text-packet' : 'blinking-tooltip'
    })
    .setContent(`${safeName} (${escapeHtml(portLabel)})${payloadLine}`)
    .setLatLng(marker.getLatLng())
    .addTo(map);

    marker.tooltip = tooltip;

    const interval = setInterval(()=>{
        if(isNodeVisibleForPackets(marker)){
            marker.setStyle({
                fillColor: blinkCount%2===0 ? 'yellow' : marker.originalColor
            });
            marker.bringToFront();
        } else {
            clearBlinkForMarker(marker);
            return;
        }
        blinkCount++;

        if(Date.now() - blinkStart > blinkDurationMs){
            clearBlinkForMarker(marker);
        }

    },500);

    activeBlinks.set(marker, interval);
}

/* ======================================================
   CHANNEL FILTERS
   ====================================================== */

function createChannelFilters(){
    const filterContainer = document.getElementById("filter-container");
    const saved = JSON.parse(localStorage.getItem("mapFilters") || "{}");

    [...channelSet].sort((a, b) => a.localeCompare(b)).forEach(channel=>{
        const cb=document.createElement("input");
        cb.type="checkbox";
        cb.className="filter-checkbox";
        cb.id=`filter-channel-${channel}`;
        cb.checked = saved[channel] !== false;

        cb.addEventListener("change", saveFiltersToLocalStorage);
        cb.addEventListener("change", updateNodeVisibility);

        filterContainer.appendChild(cb);

        const label=document.createElement("label");
        label.htmlFor=cb.id;
        label.innerText=channel;
        label.style.color = hashToColor(channel);
        filterContainer.appendChild(label);
    });

    const routerOnly=document.getElementById("filter-routers-only");
    const mqttOnly=document.getElementById("filter-mqtt-only");
    routerOnly.checked = saved["routersOnly"] || false;
    mqttOnly.checked = saved["mqttOnly"] || false;

    routerOnly.addEventListener("change", saveFiltersToLocalStorage);
    routerOnly.addEventListener("change", updateNodeVisibility);
    mqttOnly.addEventListener("change", saveFiltersToLocalStorage);
    mqttOnly.addEventListener("change", updateNodeVisibility);

    updateNodeVisibility();
}

function saveFiltersToLocalStorage(){
    const state = {};
    channelSet.forEach(ch=>{
        state[ch] = document.getElementById(`filter-channel-${ch}`).checked;
    });
    state["routersOnly"] = document.getElementById("filter-routers-only").checked;
    state["mqttOnly"] = document.getElementById("filter-mqtt-only").checked;

    localStorage.setItem("mapFilters", JSON.stringify(state));
}

function updateNodeVisibility(){
    if(!map.hasLayer(nodeLayer)) return;

    const routerOnly = document.getElementById("filter-routers-only").checked;
    const mqttOnly = document.getElementById("filter-mqtt-only").checked;
    const activeChannels = [...channelSet].filter(ch =>
        document.getElementById(`filter-channel-${ch}`).checked
    );

    nodes.forEach(n=>{
        const marker = markerById[n.key];
        if(marker){
            const visible =
                (!routerOnly || n.isRouter) &&
                (!mqttOnly || n.is_mqtt_gateway) &&
                activeChannels.includes(n.channel);

            if(visible){
                nodeLayer.addLayer(marker);
            } else {
                clearBlinkForMarker(marker);
                nodeLayer.removeLayer(marker);
            }
        }
    });
}

/* ======================================================
   SHARE / RESET
   ====================================================== */

function shareCurrentView() {
    const c = map.getCenter();
    const url = `${window.location.origin}/map?lat=${c.lat.toFixed(6)}&lng=${c.lng.toFixed(6)}&zoom=${map.getZoom()}`;

    navigator.clipboard.writeText(url).then(()=>{
        const btn = document.getElementById('share-button');
        const old = btn.textContent;
        btn.textContent = '✓ ' + (mapTranslations.link_copied || 'Link Copied!');
        btn.style.backgroundColor = '#2196F3';

        setTimeout(()=>{
            btn.textContent = old;
            btn.style.backgroundColor = '#4CAF50';
        }, 2000);
    });
}

function resetFiltersToDefaults(){
    document.getElementById("filter-routers-only").checked = false;
    document.getElementById("filter-mqtt-only").checked = false;
    channelSet.forEach(ch => {
        document.getElementById(`filter-channel-${ch}`).checked = true;
    });
    saveFiltersToLocalStorage();
    updateNodeVisibility();
}
