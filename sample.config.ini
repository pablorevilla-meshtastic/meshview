# -------------------------
# Server Configuration
# -------------------------
[server]
# The address to bind the server to. Use * to listen on all interfaces.
bind = *

# Port to run the web server on.
port = 8081

# PEM file containing the TLS certificate and private key (blank disables HTTPS).
tls_cert =


# -------------------------
# Site Appearance & Behavior
# -------------------------
[site]
# Unrecognized keys in this section are ignored and logged as warnings at startup.
# Optional domain metadata exposed by /api/config; does not configure binding or TLS.
domain =

# Select a language catalog: en, es, or ru.
language = en

# Site title to show in the browser title bar and headers.
title = Bay Area Mesh

# Short tagline for this installation, shown in the page footer and used as the page
# description by search engines and link previews. Leave empty for none.
message = Real time data from around the bay area and beyond.

# Optional announcement shown in a banner at the top of every page, for example planned
# maintenance. Visitors can dismiss it; it shows again when the text changes.
# Leave empty for none.
announcement =

# Show or hide navigation links using True or False; page/API routes remain available.
nodes = True
# Show the Chat navigation link (default: True).
chat = True
everything = True
graphs = True
stats = True
net = True
map = True
top = True
# Show the API documentation link in the navigation bar (default: True).
api = True
# Show the MeshviewWorld link in the navigation bar (default: True).
meshviewworld = True

# Map boundaries (used for the map view).
map_top_left_lat = 39
map_top_left_lon = -123
map_bottom_right_lat = 36
map_bottom_right_lon = -121

# Base map tiles for every map. Leave map_tile_url empty for OpenStreetMap. Set it to
# your own tile server (for a network without Internet access, or another map style);
# {z}, {x} and {y} are replaced by the tile zoom and position, and {s} by a subdomain
# (a, b or c). A custom server replaces the OpenTopoMap layer too. Credit the map data
# and style with map_tile_attribution (HTML allowed). map_tile_name labels it in the map
# layer picker (default: the server's host name). map_tile_max_zoom is the deepest zoom
# level it serves (default: 19).
map_tile_url =
map_tile_attribution =
map_tile_name =
map_tile_max_zoom = 19

# Map and Firehose polling intervals in seconds (default: 3).
# Zero or negative values disable automatic polling; initial data still loads.
map_interval = 3
firehose_interval = 3

# Weekly net details
weekly_net_message = Weekly Mesh check-in. We will keep it open on every Wednesday from 5:00pm for checkins. The message format should be (LONG NAME) - (CITY YOU ARE IN) #BayMeshNet.
net_tag = #BayMeshNet

# Map channel color overrides. Use six-digit hex colors; other channels get generated colors.
# Names ignore case, spaces, hyphens, and underscores. Restart the web server after editing.
[map_channel_colors]
LongFast = #4363d8
LongSlow = #000075
VeryLongSlow = #808000
MediumSlow = #008080
MediumFast = #e6194b
ShortSlow = #911eb4
ShortFast = #f58231
LongModerate = #46f0f0
ShortTurbo = #f032e6

# -------------------------
# MQTT Broker Configuration
# -------------------------
[mqtt]
# MQTT server hostname or IP.
server = mqtt.bayme.sh

# Topics as a valid JSON array of strings. /# includes all descendant topics.
topics = ["msh/US/bayarea/#", "msh/US/CA/mrymesh/#", "msh/US/CA/sacvalley/#"]

# Port used by MQTT (typically 1883 for unencrypted).
port = 1883

# MQTT username and password.
username = meshdev
password = large4cats

# Optional comma-separated node IDs to ignore, in decimal or 0x-prefixed hex.
skip_node_ids =

# Optional comma-separated base64 AES keys (16 or 32 bytes).
# Meshtastic one-byte base64 PSK shorthand is also supported.
secondary_keys =



# -------------------------
# Database Configuration
# -------------------------
[database]
# SQLAlchemy async connection string.
# Examples:
#   sqlite+aiosqlite:///packets.db
#   postgresql+asyncpg://user:pass@host:5432/meshview
connection_string = sqlite+aiosqlite:///packets.db


# -------------------------
# Database Cleanup Configuration
# -------------------------
[cleanup]
# Enable or disable daily cleanup
enabled = False
# Number of days to keep records in the database
days_to_keep = 14
# Daily cleanup time in the server's local timezone (hour 0-23, minute 0-59).
hour = 2
minute = 00
# Run SQLite VACUUM after cleanup
vacuum = False

# Enable SQLite database backups (independent of cleanup)
backup_enabled = False
# Directory to store database backups (relative or absolute path)
backup_dir = ./backups
# Daily backup time in the server's local timezone (hour 0-23, minute 0-59).
# If not specified, uses cleanup hour/minute
backup_hour = 2
backup_minute = 00

# -------------------------
# Daily Snapshot Configuration
# -------------------------
[snapshot]
# Daily snapshot time in the server's local timezone (hour 0-23, minute 0-59).
# Each capture summarizes the previous complete UTC day.
# Defaults are used if this section is omitted.
hour = 1
minute = 00


# -------------------------
# Logging Configuration
# -------------------------
[logging]
# Enable or disable HTTP access logs from the web server
# When disabled, request logs like "GET /api/packets" will not appear
# Application logs (errors, startup messages, etc.) are unaffected
# Set to True to enable, False to disable (default: False)
access_log = False
# Database cleanup logfile
db_cleanup_logfile = dbcleanup.log
